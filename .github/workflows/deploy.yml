name: CI/CD SICPES (frontend PWA -> Render)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:   # permite re-desplegar (o revertir) eligiendo una rama o tag anterior

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  build-test:
    name: 1. Preparar entorno, probar y compilar
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Preparar entorno de liberación
        run: bash scripts/setup-env.sh

      - name: Pruebas automatizadas
        run: bash scripts/test.sh

      - name: Generar artefacto
        run: bash scripts/build.sh

      - name: Guardar artefacto del build
        uses: actions/upload-artifact@v4
        with:
          name: sicpes-frontend-dist-${{ github.sha }}
          path: frontend/dist
          retention-days: 14

  deploy:
    name: 2. Desplegar en Render
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Disparar Deploy Hook de Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: bash scripts/deploy.sh

  verify:
    name: 3. Verificar versión publicada
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Verificación posterior al despliegue
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://sicpes-frontend.onrender.com' }}
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://sicpes-backend.onrender.com' }}
          EXPECTED_COMMIT: ${{ github.sha }}
          MAX_WAIT: '900'
        run: bash scripts/verify.sh
